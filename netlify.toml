[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_SITE_URL = "https://mdkdinesh2503.netlify.app"
  # Add your real values in Netlify Dashboard > Site Settings > Environment Variables:
  # VITE_GA_MEASUREMENT_ID     = G-XXXXXXXXXX
  # VITE_GOOGLE_SITE_VERIFICATION = <token-from-search-console>

# SPA routing: serve index.html for all client-side routes
# (handled by public/_redirects: /* /index.html 200)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
